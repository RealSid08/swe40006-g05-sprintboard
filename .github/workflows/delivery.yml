name: SprintBoard delivery
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, g05-ci]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan source history for secrets
        run: bash scripts/ops/scan-secrets.sh
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: json
          output: reports/security/trivy-source.json
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: '1'
          version: v0.76.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-${{ github.sha }}
          path: reports/
          retention-days: 7
  image:
    needs: quality
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: [self-hosted, linux, x64, g05-ci]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          tags: ghcr.io/realsid08/sprintboard-g05:${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/realsid08/sprintboard-g05@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-image.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          version: v0.76.0
      - name: Record immutable release and source archive
        env:
          WEB_IMAGE: ghcr.io/realsid08/sprintboard-g05@${{ steps.build.outputs.digest }}
        run: |
          python3 scripts/ops/release_manifest.py > release.json
          git archive --format=tar.gz --prefix=sprintboard/ --output=source.tar.gz "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-${{ github.sha }}
          path: |
            release.json
            source.tar.gz
            trivy-image.json
          retention-days: 7
  staging:
    needs: image
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: [self-hosted, linux, x64, g05-staging]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    outputs:
      tested: ${{ steps.gate.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Deploy exact image and backend source to staging
        env:
          RELEASE_SHA: ${{ github.sha }}
          WEB_IMAGE: ghcr.io/realsid08/sprintboard-g05@${{ needs.image.outputs.digest }}
        run: bash scripts/ops/deploy.sh staging
      - name: Run all suites on Test Server before production
        id: gate
        env:
          TEST_RUN_ID: ${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -a
          source /opt/sprintboard/runtime/.env
          set +a
          mkdir -p test-results playwright-report
          docker build -f infra/Dockerfile.test -t sprintboard-tests:${{ github.sha }} .
          docker run --rm --network host -e SITE_URL -e CONVEX_URL -e CONVEX_SITE_URL -e TEST_OUTBOX_TOKEN -e READINESS_TOKEN -e CI=true -e TEST_RUN_ID="$TEST_RUN_ID" -v "$PWD/test-results:/app/test-results" -v "$PWD/playwright-report:/app/playwright-report" sprintboard-tests:${{ github.sha }} bash -c "pnpm test && pnpm test:integration && pnpm test:e2e"
          echo 'tested=true' >> "$GITHUB_OUTPUT"
      - name: Remove this run's synthetic test data
        if: always() && steps.gate.outcome != 'skipped'
        env:
          TEST_RUN_ID: ${{ github.run_id }}${{ github.run_attempt }}
        run: |
          docker run --rm --network host --env-file /opt/sprintboard/runtime/backend.env -e TEST_RUN_ID="$TEST_RUN_ID" -v "$PWD:/app" -w /app node:24.22.0-bookworm-slim bash -c 'corepack enable && pnpm test:cleanup --prefix "qa-$TEST_RUN_ID"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: staging-tests-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  production:
    needs: [image, staging]
    if: needs.staging.outputs.tested == 'true'
    runs-on: [self-hosted, linux, x64, g05-staging]
    timeout-minutes: 12
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Promote tested image through SSM
        env:
          RELEASE_SHA: ${{ github.sha }}
          WEB_IMAGE: ghcr.io/realsid08/sprintboard-g05@${{ needs.image.outputs.digest }}
          PRODUCTION_INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          AWS_DEFAULT_REGION: us-east-1
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ops/promote.py
