global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: host
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: convex
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://backend:3211/health/ready']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: caddy
    static_configs:
      - targets: ['caddy:9180']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
