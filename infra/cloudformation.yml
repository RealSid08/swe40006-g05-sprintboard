AWSTemplateFormatVersion: '2010-09-09'
Description: G05 SprintBoard isolated staging and production hosts for AWS Academy
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  ImageId:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
  InstanceProfile:
    Type: String
    Default: LabInstanceProfile
  OperatorCidr:
    Type: String
    AllowedPattern: '([0-9]{1,3}[.]){3}[0-9]{1,3}/32'
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: vockey
Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS, ACME validation and operator SSH only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref OperatorCidr
      Tags: [{Key: Project, Value: SWE40006-G05}]
  Staging:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref WebSecurityGroup]
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 24, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags:
        - {Key: Name, Value: swe40006-g05-staging}
        - {Key: Project, Value: SWE40006-G05}
        - {Key: Environment, Value: staging}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker git
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins /opt/sprintboard
          curl --fail --location --retry 3 https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod 755 /usr/local/lib/docker/cli-plugins/docker-compose
          usermod -aG docker ec2-user
          chown ec2-user:ec2-user /opt/sprintboard
          echo 'vm.max_map_count=262144' > /etc/sysctl.d/99-sprintboard.conf
          sysctl --system
  Production:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref WebSecurityGroup]
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 24, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker git
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins /opt/sprintboard
          curl --fail --location --retry 3 https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod 755 /usr/local/lib/docker/cli-plugins/docker-compose
          usermod -aG docker ec2-user
          chown ec2-user:ec2-user /opt/sprintboard
          echo 'vm.max_map_count=262144' > /etc/sysctl.d/99-sprintboard.conf
          sysctl --system
      Tags:
        - {Key: Name, Value: swe40006-g05-production}
        - {Key: Project, Value: SWE40006-G05}
        - {Key: Environment, Value: production}
  StagingAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Staging
      Tags: [{Key: Project, Value: SWE40006-G05}]
  ProductionAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Production
      Tags: [{Key: Project, Value: SWE40006-G05}]
  Backups:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - {Id: ExpireBackups, Status: Enabled, ExpirationInDays: 7, AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}}
      Tags: [{Key: Project, Value: SWE40006-G05}]
Outputs:
  StagingInstance: {Value: !Ref Staging}
  ProductionInstance: {Value: !Ref Production}
  StagingIP: {Value: !Ref StagingAddress}
  ProductionIP: {Value: !Ref ProductionAddress}
  BackupBucket: {Value: !Ref Backups}
